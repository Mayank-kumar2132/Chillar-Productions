<style>
:root{
  --bg:#0A0A0A;
  --card:#141414;
  --card-2:#1B1B1B;
  --text:#F4F2EE;
  --muted:#A29E97;
  --line:rgba(255,255,255,.10);
  --red:#FF4436;
  --red-btn:#D9251B;
  --display:"Anton",Impact,sans-serif;
  --sans:"Inter",system-ui,sans-serif;
  --hand:"Caveat",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 30%,rgba(255,68,54,.16),transparent 70%)}
.red{color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font-family:var(--sans);font-weight:600;font-size:15.5px;text-decoration:none;border:0;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s,box-shadow .3s}
.btn svg{width:17px;height:17px}
.btn-red{background:var(--red-btn);color:#fff}
.btn-red:hover{background:#ee2f24;transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(255,68,54,.7)}
.btn-ghost{background:transparent;color:var(--text);box-shadow:0 0 0 1px var(--line) inset}
.btn-ghost:hover{box-shadow:0 0 0 1px var(--text) inset}
.ty-kicker{margin:8px 0 0;font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ty-next{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
header{padding:18px clamp(18px,4vw,48px);position:relative}
header img{height:44px;width:auto;display:block}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px 20px 60px;position:relative}
.tick{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--red-btn);box-shadow:0 0 0 12px rgba(217,37,27,.15),0 0 70px rgba(255,68,54,.45);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.tick svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.6}
h1{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(42px,7vw,84px);line-height:1.02;overflow-wrap:anywhere;max-width:100%}
.msg{margin:0;color:var(--muted);max-width:440px;line-height:1.6;font-size:17px}
footer{padding:20px;text-align:center;color:var(--muted);font-size:13px;position:relative}
@media (prefers-reduced-motion:reduce){.tick{animation:none}}
</style>
</head>
